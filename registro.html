<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse | Re-Manga</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <nav>
            <a href="index.html#hero">Re-Manga</a>

            <div>
                <a href="index.html#hero">Inicio</a>
                <a href="index.html#catalogo">Catálogo</a>
                <a href="index.html#como-funciona">Cómo funciona</a>
                <a href="index.html#vender">Vender manga</a>
                <a href="registro.html" aria-current="page">Registrarse</a>
            </div>
        </nav>
    </header>

    <main class="registro-main">
        <section class="registro-seccion" aria-labelledby="titulo-registro">
            <div class="registro-tarjeta">
                <h1 id="titulo-registro">Crear una cuenta</h1>
                <p>Únete a la comunidad de lectores de Re-Manga.</p>

                <form id="formulario-registro" novalidate>
                    <div class="campo-formulario">
                        <label for="nombre">Nombre completo</label>
                        <input id="nombre" name="nombre" type="text" placeholder="Tu nombre completo" autocomplete="name" required>
                        <p class="mensaje-error" aria-live="polite"></p>
                    </div>

                    <div class="campo-formulario">
                        <label for="email">Correo electrónico</label>
                        <input id="email" name="email" type="email" placeholder="tu-correo@ejemplo.com" autocomplete="email" required>
                        <p class="mensaje-error" aria-live="polite"></p>
                    </div>

                    <div class="campo-formulario">
                        <label for="password">Contraseña</label>
                        <input id="password" name="password" type="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password" required>
                        <p class="mensaje-error" aria-live="polite"></p>
                    </div>

                    <div class="campo-formulario">
                        <label for="confirmar-password">Confirmar contraseña</label>
                        <input id="confirmar-password" name="confirmar-password" type="password" placeholder="Repite tu contraseña" autocomplete="new-password" required>
                        <p class="mensaje-error" aria-live="polite"></p>
                    </div>

                    <button class="boton-registro" type="submit">Registrarme</button>
                    <p id="mensaje-registro" class="mensaje-registro" aria-live="polite"></p>
                </form>

                <p class="enlace-catalogo"><a href="index.html#catalogo">Volver al catálogo</a></p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Re-Manga. Manga de segunda mano.</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
